services:
  agent-api:
    build: .
    environment:
      AGENT_DB_PATH: /app/data/agent-ops.sqlite
      AGENT_SERVER_HOST: 0.0.0.0
      AGENT_SERVER_PORT: 4175
      AGENT_CORS_ORIGIN: http://localhost:4176
      AGENT_URL_ALLOWLIST: https://example.com,https://example.test,https://www.bilibili.com
      DEEPSEEK_MODEL: deepseek-v4-pro
    env_file:
      - .env
    ports:
      - "4175:4175"
    volumes:
      - agent-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4175/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  dashboard:
    build: .
    command: ["npm", "run", "preview", "--workspace", "@simple-coding-agent/dashboard", "--", "--host", "0.0.0.0", "--port", "4176"]
    environment:
      AGENT_DASHBOARD_API_BASE_URL: http://localhost:4175
    ports:
      - "4176:4176"
    depends_on:
      agent-api:
        condition: service_healthy

volumes:
  agent-data:
